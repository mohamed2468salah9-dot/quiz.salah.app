<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تطبيق مسابقة صلاة - Quiz Salah</title>
    
    <!-- ربط ملف الـ Manifest الخاص بالـ PWA -->
    <link rel="manifest" href="/manifest.json">
    <meta name="theme-color" content="#4f46e5">

    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #4f46e5, #3b82f6);
            color: #ffffff;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            text-align: center;
        }
        .container {
            background: rgba(255, 255, 255, 0.1);
            padding: 30px;
            border-radius: 15px;
            backdrop-filter: blur(10px);
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
            max-width: 400px;
            width: 90%;
        }
        h1 { font-size: 24px; margin-bottom: 15px; }
        p { font-size: 16px; margin-bottom: 25px; color: #e0e7ff; }
        .btn {
            background-color: #10b981;
            color: white;
            border: none;
            padding: 12px 25px;
            font-size: 16px;
            border-radius: 8px;
            cursor: pointer;
            transition: background 0.3s;
        }
        .btn:hover { background-color: #059669; }
    </style>
</head>
<body>

    <div class="container">
        <h1>مرحباً بك في تطبيق مسابقة صلاة</h1>
        <p>اختبر معلوماتك الدينية وابدأ التحدي الآن!</p>
        <button class="btn" onclick="startQuiz()">ابدأ المسابقة</button>
    </div>

    <script>
        function startQuiz() {
            alert("أهلاً بك يا بطل، جاري بدء المسابقة!");
        }

        // كود تسجيل الـ Service Worker لتفعيل الـ PWA والـ APK
        if (typeof navigator.serviceWorker !== 'undefined') {
            navigator.serviceWorker.register('/pwabuilder-sw.js')
                .then(function() {
                    console.log('Service Worker registered successfully.');
                })
                .catch(function(err) {
                    console.log('Service Worker registration failed: ', err);
                });
        }
    </script>
</body>
</html>
